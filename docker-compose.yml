services:
  api:
    image: ghcr.io/saleor/saleor:3.23
    container_name: dpr-saleor-api  
    ports:
      - 8000:8000
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    stdin_open: true
    tty: true
    depends_on:
      - db
      - cache
      - jaeger
    volumes:
      # shared volume between worker and api for media
      - saleor-media:/app/media
    env_file:
      - common.env
      - backend.env
    environment:
      - DASHBOARD_URL=http://localhost:9000/
      - ALLOWED_HOSTS=localhost,127.0.0.1,api
      # Overrides backend.env: the password comes from the environment (Key Vault
      # `saleor-local-db-password`; the GitHub secret of the same name in CI).
      - DATABASE_URL=postgres://saleor:${SALEOR_DB_PASSWORD:?set SALEOR_DB_PASSWORD - see README}@db/saleor

  dashboard:
    image: ghcr.io/saleor/saleor-dashboard:3.23
    ports:
      - 9000:80
    restart: unless-stopped

  db:
    container_name: saleor-postgresql
    image: library/postgres:15-alpine
    ports:
      - 5432:5432
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - saleor-db:/var/lib/postgresql/data
      - ./replica_user.sh:/docker-entrypoint-initdb.d/replica_user.sh:ro,z
    environment:
      # User and database are both "saleor", matching DATABASE_URL. They were
      # d2r_saleor with a committed password, so the api could never log in
      # and every CI test run errored (18,079 errors, 2026-08 onward).
      - POSTGRES_USER=saleor
      - POSTGRES_DB=saleor
      - POSTGRES_PASSWORD=${SALEOR_DB_PASSWORD:?set SALEOR_DB_PASSWORD - see README}
      - SALEOR_READ_ONLY_PASSWORD=${SALEOR_READ_ONLY_DB_PASSWORD:?set SALEOR_READ_ONLY_DB_PASSWORD - see README}

  cache:
    image: valkey/valkey:8.1-alpine
    ports:
      - 6379:6379
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - saleor-cache:/data

  worker:
    image: ghcr.io/saleor/saleor:3.23
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    env_file:
      - common.env
      - backend.env
    environment:
      - DATABASE_URL=postgres://saleor:${SALEOR_DB_PASSWORD:?set SALEOR_DB_PASSWORD - see README}@db/saleor
    depends_on:
      - cache
      - mailpit
    volumes:
      # shared volume between worker and api for media
      - saleor-media:/app/media

  jaeger:
    image: jaegertracing/jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - type: tmpfs
        target: /tmp

  mailpit:
    image: axllent/mailpit
    ports:
      - 1025:1025 # smtp server
      - 8025:8025 # web ui. Visit http://localhost:8025/ to check emails
    restart: unless-stopped
    networks:
      - saleor-backend-tier

volumes:
  saleor-db:
    driver: local
  saleor-cache:
    driver: local
  saleor-media:

networks:
  saleor-backend-tier:
    driver: bridge
